DB.H.slice(0,5).forEach(h=>L.push({id:"h:"+h.join("|"),c:"#2A44B5",t:h[1]+" — "+h[2],s:h[5]+" · "+h[0],g:"Riwayat"}));
return L}
const unread=()=>notifs().filter(n=>!isR(n.id)).length;
function drawN(){var L=notifs(),u=L.filter(n=>!isR(n.id)),o=L.filter(n=>isR(n.id));
$("np").innerHTML='<div class="nh"><b>Notifikasi</b>'+(u.length?'<button data-act="readall">Tandai semua dibaca</button>':'')+'</div>'+(u.concat(o).map(n=>'<div class="ni'+(isR(n.id)?"":" u")+'" data-act="nopen" data-id="'+E(n.id)+'" data-g="'+n.g+'"><i class="d" style="background:'+n.c+'"></i><div><div class="nt">'+E(n.t)+'</div><div class="ns">'+E(n.s)+'</div></div></div>').join("")||'<div class="empty">Tidak ada notifikasi.</div>')}
function openN(){var n=$("np"),r=$("bell").getBoundingClientRect();drawN();n.classList.remove("hide");n.style.top=(r.bottom+6)+"px";n.style.right=Math.max(8,innerWidth-r.right)+"px"}
function closeN(){$("np").classList.add("hide")}
function doLogin(){var n=$("nipp").value.trim();if(!/^\d{4,10}$/.test(n)){$("er").textContent="Masukkan NIPP berupa angka (4–10 digit).";return}
var u=DB.USR.filter(x=>x[2]==n)[0];$("er").textContent="";user=n;$("who").textContent=(u?u[0]:"Petugas")+" · NIPP "+n;$("login").classList.add("hide");$("app").classList.remove("hide");cur="Dashboard";edit=false;render()}
document.addEventListener("click",e=>{var pf=e.target.closest(".pf");if(pf){var on=pf.dataset.v!="1";pf.dataset.v=on?"1":"";pf.classList.toggle("on",on);R[+pf.closest("tr").dataset.i].par=on?"1":"";return}
var pk=e.target.closest("[data-pick]");if(pk){openPK(pk);return}
var pa=e.target.closest("[data-pk]");if(pa){pkAct(pa);return}
if(!e.target.closest("#pk"))closePK();if(!e.target.closest("#np")&&!e.target.closest("#bell"))closeN();
var b=e.target.closest("[data-go]");if(b){cur=b.getAttribute("data-go");edit=false;render();return}
var a=e.target.closest("[data-act]");if(!a)return;var x=a.dataset.act,s=a.dataset.s,i=+a.dataset.i;
if(x=="login")doLogin();
else if(x=="logout"){$("app").classList.add("hide");$("login").classList.remove("hide");$("nipp").value=""}
else if(x=="theme"){var r=document.documentElement,d=r.getAttribute("data-theme")=="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",d?"light":"dark")}
else if(x=="new"){cur="Formulir Checklist";edit=true;cf=-1;render()}
else if(x=="openf"||x=="printf"){cur="Formulir Checklist";edit=true;cf=i;render();if(x=="printf")setTimeout(()=>window.print(),300)}
else if(x=="back"){edit=false;render()}
else if(x=="reset"){render()}
else if(x=="print")window.print()
else if(x=="save")saveForm(false)
else if(x=="final")saveForm(true)
else if(x=="add")openForm(s,-1)
else if(x=="edit")openForm(s,i)
else if(x=="msave")doSave(s,i)
else if(x=="mx")closeM()
else if(x=="del")openM('<h2>Hapus data?</h2><p style="font-size:14px;color:var(--tx2)">'+E(s=="F"?DB.F[i].ref:DB[KEY(s)][i][0])+' akan dihapus.</p><div class="mb"><button class="btn ghost" data-act="mx">Batal</button><button class="btn" style="background:#B3261E" data-act="mdel" data-s="'+s+'" data-i="'+i+'">Hapus</button></div>')
else if(x=="mdel"){var k=KEY(s),it=DB[k][i];DB[k].splice(i,1);if(s=="Master APAR")hist(it[0],"Hapus APAR","Aktif","—","Aset APAR "+it[0]+" dihapus.");save();closeM();render()}
else if(x=="refill"){var p=DB.A[i];p[8]=TS;p[9]=TS.slice(0,6)+(TODAY.getFullYear()+1);hist(p[0],"Isi Ulang","—","—","Isi ulang APAR "+p[0]+".");save();render()}
else if(x=="bell"){if($("np").classList.contains("hide"))openN();else closeN()}
else if(x=="nopen"){markR(a.dataset.id);save();closeN();var g=a.dataset.g;if(g=="new"){cur="Formulir Checklist";edit=true;cf=-1}else{cur=g;edit=false}render()}
else if(x=="readall"){notifs().forEach(n=>markR(n.id));save();render()}
else if(x=="resetdb"){DB=JSON.parse(JSON.stringify(SEED));save();render()}});
document.addEventListener("input",e=>{var t=e.target;
if(t.id=="q"){var p=t.selectionStart;$("view").innerHTML=master(t.value);var q=$("q");q.focus();q.setSelectionRange(p,p);return}
if(t.id=="tgl"){head();recalc();return}if(t.id=="ref"){t.dataset.d="1";return}
var row=t.closest&&t.closest("#tb tr");if(row&&t.dataset.f){R[+row.dataset.i][t.dataset.f]=t.value;ee(t);if(t.dataset.f=="lok")recalc()}});
$("nipp").addEventListener("keydown",e=>{if(e.key=="Enter")doLogin()});
</script>
